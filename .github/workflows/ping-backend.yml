name: Ping Backend Server

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wait 30 seconds
        run: sleep 30

      - name: Ping backend server
        run: |
          echo "Pinging Render backend..."
          curl -v -f \
            --retry 3 \
            --retry-delay 10 \
            --max-time 120 \
            https://rumtest.onrender.com/api/rum/health
          echo "Ping successful!"
