name: Ping Backend Server

on:
  schedule:
    - cron: "*/5 * * * *"   # runs every 5 minutes
  workflow_dispatch:        # allows manual run

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wait 30 seconds
        run: sleep 30

      - name: Ping backend server
        run: |
          curl -X GET https://rumtest.onrender.com/api/rum/health
